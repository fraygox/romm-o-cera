# The documentation website: https://fraygox.github.io/romm-o-cera/
# Built from README.md and docs/ (tools/docs_site.py + mkdocs.yml) on every push to main.
name: docs
on:
  push:
    branches: [main]
    paths: [README.md, "docs/**", "screenshots/**", mkdocs.yml, tools/docs_site.py, tools/docs-requirements.txt, .github/workflows/docs.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/docs-requirements.txt
      - run: python tools/docs_site.py && mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

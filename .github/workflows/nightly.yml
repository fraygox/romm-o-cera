# The nightly channel follows main: each push that changes the app is
# tested, built as VERSION+nYYYYMMDD.HHMM.commit and replaces the rolling
# "nightly" prerelease (never GitHub's "latest": stable installs ignore it).
# A burst of pushes builds once, for the newest. `tools/release.py nightly`
# (or Run workflow on GitHub) builds now.
name: nightly
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "CHANGELOG.md", "screenshots/**", "mkdocs.yml", "tests/**",
                   "tools/docs_site.py", "tools/docs-requirements.txt", ".github/workflows/docs.yml"]
  workflow_dispatch:
    inputs:
      force:
        description: Build even if main hasn't changed
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: nightly
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.c.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: c
        run: |
          head=$(git rev-parse HEAD)
          last=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          if [ "${{ inputs.force }}" = true ] || [ "$head" != "$last" ]; then
              echo build=true >> "$GITHUB_OUTPUT"
          else
              echo "main is still the last nightly ($head)"; echo build=false >> "$GITHUB_OUTPUT"
          fi
  tests:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/tests.yml
  publish:
    needs: [check, tests]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          stamp="n$(date -u +%Y%m%d.%H%M).$(git rev-parse --short=7 HEAD)"
          label=$(NIGHTLY="$stamp" OUT=dist tools/build-release.sh)
          echo "LABEL=$label" >> "$GITHUB_ENV"
          python3 tools/release.py notes --nightly > notes.md
      - name: Publish
        run: |
          git tag -f nightly HEAD
          git push -f origin refs/tags/nightly
          # a new release each build, so GitHub shows this build's date (an edited
          # release keeps the date it was first published). The tag and download
          # URLs stay the same; create uploads the files to a draft and publishes
          # it once they're all there, so the title (which the app reads) never
          # names a build whose files are missing.
          gh release delete nightly --yes >/dev/null 2>&1 || true
          gh release create nightly --verify-tag --prerelease --latest=false --title "Nightly v$LABEL" \
              --notes-file notes.md dist/romm-o-cera.zip dist/SHA256SUMS dist/install.sh

# The test suite on every push and pull request; nightly.yml and release.yml
# run it too (workflow_call) and publish nothing if it fails.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -qq zip unzip libzstd1 >/dev/null
      - run: pip install -q -r tests/requirements.txt pytest-xdist
      - run: python -m pytest -q -p no:cacheprovider -n 4
